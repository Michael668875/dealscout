{% extends "keyboard_tracker/layout.html" %}

{% block content %}
    {% for feature in features %}
    <a href="{% url 'feature' feature.slug %}?country={{ selected_country }}"
        class="btn btn-sm btn-danger px-1 mb-2 model-menu">
        {{ feature.name }}
    </a>
    {% endfor %}

    {% if listings %}
        {% include "keyboard_tracker/feature.html" %}
    {% endif %}

{% endblock %}
